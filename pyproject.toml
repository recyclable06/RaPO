[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapo-reproduction"
version = "0.1.0"
description = "Independent reproduction of Retention-aware Policy Optimization"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "torch>=2.5.1,<2.6",
]

[project.optional-dependencies]
data = [
    "datasets>=3.2,<4",
    "pillow",
]
test = [
    "pytest>=8,<9",
]

[project.scripts]
rapo-build-imagenet-r = "rapo.data:main"
rapo-evaluate = "rapo.evaluation:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
